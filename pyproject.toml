[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-audit"
version = "0.1.0"
description = "Zero-dependency CLI & Agent Skill for auditing Codex and Antigravity (agy) coding agent sessions: token usage, prompt cache efficiency, context bloat X-ray, and tool failures."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "gmen1057" }
]
keywords = ["ai-agents", "codex", "antigravity", "token-usage", "prompt-caching", "cli", "agent-skills"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]
dependencies = []

[project.scripts]
agent-audit = "agent_audit:main"

[tool.setuptools]
py-modules = ["agent_audit"]
